<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Price Watch</title>
  <meta name="description" content="Historique des prix et bons moments pour acheter un téléphone dans les enseignes françaises.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23D21F3C'/><path d='M5 16l5-5.5h15a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H10z' fill='%23FFD23F'/><circle cx='9.5' cy='16' r='1.6' fill='%23D21F3C'/><path d='M14 13h3v3h3v3h3' stroke='%23D21F3C' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <!-- Apply the saved theme before first paint, so there is no flash. -->
  <script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha384-bs/nf9FbdNouRbMiFcrcZfLXYPKiPaGVGplVbv7dLGECccEXDW+S3zjqSKR5ZEaD" crossorigin="anonymous" defer></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap top-in">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 16l6-7h18a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9z" fill="#FFD23F"/><circle cx="8.5" cy="16" r="1.8" fill="var(--bg)"/><path d="M13 12.5h4v3.5h4v3.5h4" stroke="#D21F3C" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div>
          <h1>Price Watch</h1>
          <p id="checked" class="muted"></p>
        </div>
      </div>
      <button id="theme" class="icon-btn" type="button"></button>
    </div>
  </header>

  <main id="view" class="wrap" tabindex="-1"></main>

  <nav class="tabs" aria-label="Sections">
    <a href="#modeles" data-tab="modeles">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="7" height="12" rx="1.6"/><rect x="13" y="3" width="7" height="12" rx="1.6"/><path d="M4 19h16"/></svg>
      Modèles
    </a>
    <a href="#courbe" data-tab="courbe">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h5v5h5v5h8"/><path d="M3 20h18"/></svg>
      Courbe
    </a>
    <a href="#offres" data-tab="offres">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12l4.5-5.5h12.5a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H7z"/><circle cx="7.5" cy="12" r="1"/></svg>
      Offres
    </a>
    <a href="#soldes" data-tab="soldes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      Soldes
    </a>
  </nav>
</body>
</html>
