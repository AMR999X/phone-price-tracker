plugins { id 'com.android.application' }

android {
    namespace 'fr.pricewatch'
    compileSdk 36
    defaultConfig {
        applicationId 'fr.pricewatch'
        minSdk 29
        targetSdk 34 // 35+ forces edge-to-edge drawing under the status bar; not worth it for a sideloaded app
        versionCode 5
        versionName "2.1"
    }
    // The app's screens are the website itself.
    buildFeatures { buildConfig true } // App.java puts the version in crash reports
    sourceSets { main { assets.srcDirs = ['../../public'] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
